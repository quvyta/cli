# Русский

[meta]
name = "Русский"
code = "ru"
fallback = "en"

[app]
name = "qcli"

[header]
no-model = "модель не выбрана"

[chat]
empty = "Спросите что угодно об этой папке. Модель может читать, просматривать список и искать здесь; перед изменением файла или запуском команды она спросит разрешения."
agents = "{file} читается как инструкции."
placeholder = "Напишите сообщение"

[action]
read = "чтение"
list = "список"
search = "поиск"
edit = "правка"
run = "запуск"
more = { one = "и ещё {n} строка", few = "и ещё {n} строки", many = "и ещё {n} строк", other = "и ещё {n} строки" }
empty = "нет вывода"

[ask]
edit = "Изменить {path}?"
run = "Выполнить эту команду?"
allow = "Разрешить"
deny = "Отклонить"

[status]
waiting = "ожидание ответа"
acting = "выполняется {what}"

[notice]
provider = "Провайдер не ответил: {said}"
unset = "Провайдер пока не настроен. Откройте настройки провайдера, чтобы добавить его."
stopped = "Остановлено."
cut = "Ответ достиг предела длины и оборвался на середине."
rounds = "Ход остановился — сделано запросов: {n}. Напишите ещё раз, чтобы продолжить."
unsaved = "Не удалось сохранить разговор: {reason}"

[provider]
title = "Провайдер"
intro = "Где находится модель. Сам ключ здесь никогда не записывается — только файл, в котором он лежит."
address = "Адрес"
address-hint = "Адрес, под которым работает Messages API; запросы идут на …/v1/messages"
model = "Модель"
model-hint = "Название модели так, как его пишет провайдер"
key-file = "Файл ключа"
key-file-hint = "Файл, содержащий только ключ; ~/ — ваша домашняя папка"
key-header = "Заголовок ключа"
key-header-hint = "Оставьте пустым для x-api-key; некоторые серверы требуют другое имя"
empty = "Это поле не может быть пустым."
key-unreadable = "Не удалось прочитать {path}: {reason}"
not-a-key = "{path} не содержит ключ: файл пуст или содержит более одной строки."
unsaved = "Не удалось записать настройки: {reason}"
save = "Сохранить"
cancel = "Отмена"

[keys]
send = "отправить"
stop = "стоп"
allow = "разрешить"
deny = "отклонить"
new = "новый чат"
provider = "провайдер"
